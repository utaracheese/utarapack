<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>utara🧀 - Pack Sharing</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Nền hoàng hôn - Khóa cuộn trang web ngoài */
    body {
      height: 100vh;
      height: 100dvh;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 25%, #8ec5fc 75%, #4facfe 100%);
      background-attachment: fixed;
      color: #1e293b;
      overflow: hidden;
      position: relative;
    }

    /* Canvas tuyết rơi */
    #snow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* TOP BAR - CỐ ĐỊNH PHÍA TRÊN */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    /* Gmail ở góc trái */
    .contact-email {
      font-size: 0.85rem;
      color: #1e293b;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.4);
      padding: 8px 16px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      user-select: text;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* THANH GẠT JAVA / BEDROCK */
    .version-toggle-container {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .version-toggle-container.hidden {
      display: none;
    }

    .version-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.38);
      padding: 4px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      gap: 4px;
    }

    .switch-btn {
      border: none;
      background: transparent;
      padding: 7px 22px;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      user-select: none;
    }

    .switch-btn:hover {
      color: #0f172a;
    }

    .switch-btn.active {
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    /* KHU VỰC BÊN PHẢI (NÚT HỘP LẺ + TIKTOK + NÚT THƯ) */
    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* NÚT ICON TRÒN (HỘP & THƯ) */
    .icon-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      cursor: pointer;
      font-size: 1.25rem;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      user-select: none;
    }

    .icon-btn:hover {
      transform: translateY(-2px) scale(1.05);
      background: rgba(255, 255, 255, 0.65);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    /* Trạng thái khi nút Hộp đang kích hoạt */
    .icon-btn.active {
      background: rgba(255, 255, 255, 0.95);
      border-color: #ffffff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
      transform: scale(1.08);
    }

    .tiktok-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 18px 6px 8px;
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 50px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .tiktok-profile:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.65);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .avatar-wrapper {
      width: 44px;
      height: 44px;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
    }

    .profile-info {
      display: flex;
      flex-direction: column;
    }

    .profile-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
    }

    .profile-id {
      font-size: 0.78rem;
      color: #475569;
      font-weight: 500;
    }

    /* Chấm đỏ thông báo */
    .red-dot {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 11px;
      height: 11px;
      background-color: #ef4444;
      border-radius: 50%;
      border: 2px solid #ffffff;
      display: none;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.9);
    }

    .red-dot.show {
      display: block;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* GRID DANH SÁCH PACK */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 24px;
      flex: 1;
      overflow-y: auto;
      padding: 10px 10px 20px 4px;
      scroll-behavior: smooth;
    }

    .gallery-grid::-webkit-scrollbar {
      width: 8px;
    }
    .gallery-grid::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
    .gallery-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 10px;
    }
    .gallery-grid::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.8);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      font-size: 1.1rem;
      color: #334155;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      margin: auto;
      max-width: 500px;
    }

    /* CARD PACK */
    .pack-card {
      background: rgba(255, 255, 255, 0.35);
      border-radius: 24px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      cursor: pointer;
      transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      user-select: none;
      height: fit-content;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pack-card:hover {
      transform: translateY(-6px);
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
      border-color: rgba(255, 255, 255, 0.9);
    }

    /* SLIDER ẢNH */
    .carousel-container {
      width: 100%;
      height: 220px;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      background: rgba(0, 0, 0, 0.05);
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .carousel-slide {
      min-width: 100%;
      width: 100%;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    .carousel-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s, transform 0.2s;
      font-size: 14px;
      z-index: 5;
    }

    .pack-card:hover .carousel-nav {
      opacity: 1;
    }

    .carousel-nav:hover {
      background: rgba(0, 0, 0, 0.75);
      transform: translateY(-50%) scale(1.1);
    }

    .carousel-prev { left: 10px; }
    .carousel-next { right: 10px; }

    .carousel-dots {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 5;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transition: all 0.25s;
    }

    .dot.active {
      background: #fff;
      width: 18px;
      border-radius: 6px;
    }

    .card-footer {
      padding: 12px 6px 4px 6px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      display: block;
    }

    /* FOOTER NOTE */
    .footer-note {
      text-align: center;
      margin-top: 14px;
      padding: 8px 12px;
      font-size: 0.74rem;
      color: rgba(15, 23, 42, 0.75);
      font-weight: 500;
      line-height: 1.4;
      user-select: text;
      flex-shrink: 0;
      transition: opacity 0.2s ease;
    }

    /* MODAL POPUP */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(25px);
      border-radius: 28px;
      width: 100%;
      max-width: 580px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
      transform: scale(0.9);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .btn-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.08);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #333;
      transition: 0.2s;
      z-index: 10;
    }

    .btn-close:hover {
      background: rgba(0, 0, 0, 0.18);
      transform: rotate(90deg);
    }

    .modal-carousel {
      height: 280px;
      margin-bottom: 18px;
    }

    .modal-carousel .carousel-nav {
      opacity: 0.75;
    }

    .modal-carousel:hover .carousel-nav {
      opacity: 1;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      line-height: 1.4;
      word-break: break-word;
    }

    .modal-desc {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #334155;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.6);
      padding: 12px 16px;
      border-radius: 14px;
      max-height: 140px;
      overflow-y: auto;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: #0f172a;
      color: #fff;
    }

    .btn-primary:hover {
      background: #334155;
      transform: translateY(-2px);
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.85);
      color: #0f172a;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .btn-copy:hover {
      background: #fff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <canvas id="snow-canvas"></canvas>

  <div class="container">
    <!-- Top Bar -->
    <div class="top-bar">
      <!-- Gmail bên trái -->
      <div class="contact-email">
        <span>✉️</span>
        <span>thanhbinhanhduong2@gmail.com</span>
      </div>

      <!-- NÚT GẠT JAVA / BEDROCK Ở GIỮA (Có thể bị ẩn khi vào kho lẻ) -->
      <div class="version-toggle-container" id="versionToggleContainer">
        <div class="version-switch">
          <button class="switch-btn active" id="tabJava" onclick="switchVersion('java')">Java</button>
          <button class="switch-btn" id="tabBedrock" onclick="switchVersion('bedrock')">Bedrock</button>
        </div>
      </div>

      <!-- Khu vực bên phải: NÚT HỘP LẺ + PROFILE TIKTOK + NÚT THƯ -->
      <div class="top-bar-right">
        <!-- NÚT HỘP PACK LẺ -->
        <button class="icon-btn" id="singlePackBtn" title="Kho Pack lẻ" onclick="toggleSinglePackMode()">
          <span>📦</span>
        </button>

        <a href="https://www.tiktok.com/@utara2613" target="_blank" class="tiktok-profile">
          <div class="avatar-wrapper">
            <img src="assets/avt.png" onerror="this.src='https://api.dicebear.com/7.x/notionists/svg?seed=utara'" alt="Avatar">
          </div>
          <div class="profile-info">
            <span class="profile-name">utara🧀</span>
            <span class="profile-id">utara2613</span>
          </div>
        </a>

        <button class="icon-btn" id="mailBtn" title="Hộp thư thông báo">
          <span>💌</span>
          <span class="red-dot" id="mailRedDot"></span>
        </button>
      </div>
    </div>

    <!-- Danh sách Pack Cards -->
    <div class="gallery-grid" id="packGrid"></div>

    <!-- Dòng lưu ý footer -->
    <div class="footer-note" id="footerNote"></div>
  </div>

  <!-- Modal Chi Tiết Pack -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-content">
      <button class="btn-close" id="btnClose">&times;</button>
      
      <div class="carousel-container modal-carousel">
        <div class="carousel-track" id="modalCarouselTrack"></div>
        <button class="carousel-nav carousel-prev" id="modalPrev">&#10094;</button>
        <button class="carousel-nav carousel-next" id="modalNext">&#10095;</button>
        <div class="carousel-dots" id="modalDots"></div>
      </div>

      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-actions">
        <a id="modalLinkBtn" href="#" target="_blank" class="btn btn-primary">🔗 Mở liên kết</a>
        <button id="btnCopyLink" class="btn btn-copy">📋 Sao chép Link</button>
      </div>
    </div>
  </div>

  <!-- Modal Hộp Thư -->
  <div class="modal-overlay" id="mailModal">
    <div class="modal-content" style="max-width: 480px;">
      <button class="btn-close" id="btnCloseMail">&times;</button>
      
      <div style="font-size: 2.2rem; text-align: center; margin-bottom: 6px;">💌</div>
      <h2 class="modal-title" id="mailModalTitle" style="text-align: center;"></h2>
      <div class="modal-desc" id="mailModalBody" style="white-space: pre-line; max-height: 220px; line-height: 1.6;"></div>
      
      <div class="modal-actions">
        <button id="btnReadMail" class="btn btn-primary">Đã hiểu ✨</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
